version: '3'
silent: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install the project
    cmds:
      - echo "Installing"
      - |
        # Check if the external network 'frontend' exists, create if not
        if ! docker network ls --format '{{.Name}}' | grep -wq frontend; then
          echo "Creating external network 'frontend'"
          docker network create frontend
        else
          echo "External network 'frontend' already exists"
        fi
      - docker compose pull
      - docker compose up --force-recreate --detach --remove-orphans
#      - echo "Waiting for database to be ready"
#      - sleep 20
      - echo "Initialize the database"
      - docker compose exec api bin/console doctrine:schema:create
      - echo "Create jwt key pair"
      - docker compose exec api bin/console lexik:jwt:generate-keypair --skip-if-exists
#      - task tenant:add
#      - echo "CREATE AN ADMIN USER. CHOOSE THE TENANT YOU JUST CREATED."
#      - task user:add
#      - task template:load
      - task _install:show-urls

  purge:
    desc: Remove all containers and volumes
    cmds:
      - docker compose down --volumes --remove-orphans
      - |
        # Check if the external network 'frontend' exists, remove if it does
        if docker network ls --format '{{.Name}}' | grep -wq frontend; then
          echo "Removing external network 'frontend'"
          docker network rm frontend
        else
          echo "External network 'frontend' does not exist"
        fi
      - rm -f docker-compose.yml .env.local

  db:backup:
    desc: Perform a database dump, if you use the default internal mariadb. The dump file will be saved in the 'db_backups' directory with a timestamp in the filename.
    aliases:
      - backup_db
    cmds:
      - |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        DB_BACKUP_DIR=$(pwd)/db_backups
        FILENAME=$DB_BACKUP_DIR/db_backup_$TIMESTAMP.sql
        echo "Performing database backup..."
        mkdir -p $DB_BACKUP_DIR  # Ensure the backup directory exists
        DB_USER=$(grep ^MARIADB_USER= .env.docker.local | cut -d '=' -f 2)
        DB_NAME=$(grep ^MARIADB_DATABASE= .env.docker.local | cut -d '=' -f 2)
        DB_PASSWORD=$(grep ^MARIADB_PASSWORD= .env.docker.local | cut -d '=' -f 2)
        echo "Using database user: $DB_USER and database name: $DB_NAME"
        docker compose --env-file .env.local --env-file .env.docker.local -f docker-compose.yml exec mariadb mysqldump -u $DB_USER -p$DB_PASSWORD $DB_NAME > $FILENAME
        if [ $? -eq 0 ]; then
          echo "Database backup saved to $FILENAME"
        fi

  _install:show-urls:
    cmds:
      - |
        DOMAIN=$(grep ^COMPOSE_SERVER_DOMAIN= .env.docker.local | cut -d '=' -f 2)
        echo ""
        echo "===================================================="
        echo "OS2display now is available via the URLs below"
        echo "===================================================="
        echo "Admin: https://$DOMAIN/admin"
        echo "Screen: https://$DOMAIN/client"
        echo "===================================================="

  _env:build:
    desc: Build .env from .env.example by prompting for placeholder values
    cmds:
      - |
        INPUT=".env.example"
        OUTPUT=".env"
        CACHE=$(mktemp)
        trap "rm -f $CACHE" EXIT

        if [ ! -f "$INPUT" ]; then
          echo "Error: $INPUT not found."
          exit 1
        fi

        # First pass: collect unique placeholder values
        while IFS= read -r line || [ -n "$line" ]; do
          for PLACEHOLDER in $(echo "$line" | grep -oE '<[^:]+:-[^>]*>'); do
            VAR_NAME=$(echo "$PLACEHOLDER" | sed 's/^<\([^:]*\):-.*>/\1/')
            FOUND=0
            grep -q "^${VAR_NAME}=" "$CACHE" 2>/dev/null && FOUND=1
            if [ "$FOUND" = "0" ]; then
              DEFAULT=$(echo "$PLACEHOLDER" | sed 's/^<[^:]*:-\(.*\)>/\1/')
              printf "%s [%s]: " "$VAR_NAME" "$DEFAULT" > /dev/tty
              read ANSWER < /dev/tty
              echo "${VAR_NAME}=${ANSWER:-$DEFAULT}" >> "$CACHE"
            fi
          done
        done < "$INPUT"

        # Second pass: replace placeholders with values
        rm -f "$OUTPUT"
        while IFS= read -r line || [ -n "$line" ]; do
          RESULT="$line"
          while echo "$RESULT" | grep -qE '<[^:]+:-[^>]*>'; do
            MATCH=$(echo "$RESULT" | grep -oE '<[^:]+:-[^>]*>' | head -1)
            VAR_NAME=$(echo "$MATCH" | sed 's/^<\([^:]*\):-.*>/\1/')
            VALUE=$(grep "^${VAR_NAME}=" "$CACHE" | cut -d '=' -f 2-)
            ESCAPED_MATCH=$(printf '%s\n' "$MATCH" | sed 's/[[\.*^$()+?{|\/]/\\&/g')
            ESCAPED_VALUE=$(printf '%s\n' "$VALUE" | sed 's/[&\/]/\\&/g')
            RESULT=$(printf '%s\n' "$RESULT" | sed "s|${ESCAPED_MATCH}|${ESCAPED_VALUE}|")
          done
          printf '%s\n' "$RESULT" >> "$OUTPUT"
        done < "$INPUT"

        echo ""
        echo "$OUTPUT has been created."

  _env:check:
    desc: Check that the .env files exist
    cmds:
      - |
        if [ ! -f .env.example ]; then
          echo "Error: .env.example not found. The repository may be incomplete."
          exit 1
        fi
        echo "Copying .env.example to .env.local..."
        cp .env.example .env.local
      - |
        if [ ! -f .env.docker.local ]; then
          echo "Error: .env.docker.local not found."
          echo "Create it by running: cp .env.docker.example .env.docker.local"
          echo "Then edit it with your local settings before running this task again."
          exit 1
        fi
