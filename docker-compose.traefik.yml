networks:
  proxy:
    driver: bridge
    internal: true

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    networks:
      - frontend
      - proxy
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - $PWD/traefik/ssl:/certs:ro
      - $PWD/traefik/traefik.yml:/traefik.yml:ro
      - $PWD/traefik/dynamic-conf.yaml:/config/dynamic-conf.yaml:ro

  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    user: root
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
