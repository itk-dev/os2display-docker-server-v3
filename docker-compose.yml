networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  os2display:
    image: ghcr.io/itk-dev/os2display-api-service:${COMPOSE_IMAGE_VERSION}
    restart: unless-stopped
    networks:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # PHP config values
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE}
      - PHP_TIMEZONE=UTC
      - PHP_PM_MAX_CHILDREN=16
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0

      # APP (Symfony)
      - APP_ENV=${APP_ENV}
      - APP_SECRET=${APP_SECRET:?err}

      - DATABASE_URL=${APP_DATABASE_URL:?err}
      - JWT_PASSPHRASE=${APP_JWT_PASSPHRASE:?err}
      - JWT_TOKEN_TTL=${APP_JWT_TOKEN_TTL}
      - JWT_SCREEN_TOKEN_TTL=${APP_JWT_SCREEN_TOKEN_TTL}
      - JWT_REFRESH_TOKEN_TTL=${APP_JWT_REFRESH_TOKEN_TTL}
      - JWT_SCREEN_REFRESH_TOKEN_TTL=${APP_JWT_SCREEN_REFRESH_TOKEN_TTL}

      - TRUSTED_PROXIES=${APP_TRUSTED_PROXIES}
      - CORS_ALLOW_ORIGIN=${APP_CORS_ALLOW_ORIGIN}
      - DEFAULT_DATE_FORMAT=${APP_DEFAULT_DATE_FORMAT}
      - ACTIVATION_CODE_EXPIRE_INTERVAL=${APP_ACTIVATION_CODE_EXPIRE_INTERVAL}

      # OIDC - internal provider
      - INTERNAL_OIDC_METADATA_URL=${APP_INTERNAL_OIDC_METADATA_URL}
      - INTERNAL_OIDC_CLIENT_ID=${APP_INTERNAL_OIDC_CLIENT_ID}
      - INTERNAL_OIDC_CLIENT_SECRET=${APP_INTERNAL_OIDC_CLIENT_SECRET}
      - INTERNAL_OIDC_REDIRECT_URI=${APP_INTERNAL_OIDC_REDIRECT_URI}
      - INTERNAL_OIDC_LEEWAY=${APP_INTERNAL_OIDC_LEEWAY}
      - INTERNAL_OIDC_CLAIM_NAME=${APP_INTERNAL_OIDC_CLAIM_NAME}
      - INTERNAL_OIDC_CLAIM_EMAIL=${APP_INTERNAL_OIDC_CLAIM_EMAIL}
      - INTERNAL_OIDC_CLAIM_GROUPS=${APP_INTERNAL_OIDC_CLAIM_GROUPS}

      # OIDC - external provider
      - EXTERNAL_OIDC_METADATA_URL=${APP_EXTERNAL_OIDC_METADATA_URL}
      - EXTERNAL_OIDC_CLIENT_ID=${APP_EXTERNAL_OIDC_CLIENT_ID}
      - EXTERNAL_OIDC_CLIENT_SECRET=${APP_EXTERNAL_OIDC_CLIENT_SECRET}
      - EXTERNAL_OIDC_REDIRECT_URI=${APP_EXTERNAL_OIDC_REDIRECT_URI}
      - EXTERNAL_OIDC_LEEWAY=${APP_EXTERNAL_OIDC_LEEWAY}
      - EXTERNAL_OIDC_HASH_SALT=${APP_EXTERNAL_OIDC_HASH_SALT}
      - EXTERNAL_OIDC_CLAIM_ID=${APP_EXTERNAL_OIDC_CLAIM_ID}

      - OIDC_CLI_REDIRECT=${APP_OIDC_CLI_REDIRECT}

      - REDIS_CACHE_PREFIX=${APP_REDIS_CACHE_PREFIX}
      - REDIS_CACHE_DSN=${APP_REDIS_CACHE_DSN}

      # Calendar Api Feed Source
      - CALENDAR_API_FEED_SOURCE_LOCATION_ENDPOINT=${APP_CALENDAR_API_FEED_SOURCE_LOCATION_ENDPOINT}
      - CALENDAR_API_FEED_SOURCE_RESOURCE_ENDPOINT=${APP_CALENDAR_API_FEED_SOURCE_RESOURCE_ENDPOINT}
      - CALENDAR_API_FEED_SOURCE_EVENT_ENDPOINT=${APP_CALENDAR_API_FEED_SOURCE_EVENT_ENDPOINT}
      - CALENDAR_API_FEED_SOURCE_CUSTOM_MAPPINGS=${APP_CALENDAR_API_FEED_SOURCE_CUSTOM_MAPPINGS}
      - CALENDAR_API_FEED_SOURCE_EVENT_MODIFIERS=${APP_CALENDAR_API_FEED_SOURCE_EVENT_MODIFIERS}
      - CALENDAR_API_FEED_SOURCE_DATE_FORMAT=${APP_CALENDAR_API_FEED_SOURCE_DATE_FORMAT}
      - CALENDAR_API_FEED_SOURCE_DATE_TIMEZONE=${APP_CALENDAR_API_FEED_SOURCE_DATE_TIMEZONE}
      - CALENDAR_API_FEED_SOURCE_CACHE_EXPIRE_SECONDS=${APP_CALENDAR_API_FEED_SOURCE_CACHE_EXPIRE_SECONDS}

      # Event Database Api V2
      - EVENTDATABASE_API_V2_CACHE_EXPIRE_SECONDS=${APP_EVENTDATABASE_API_V2_CACHE_EXPIRE_SECONDS}

      - TRACK_SCREEN_INFO=${APP_TRACK_SCREEN_INFO}
      - TRACK_SCREEN_INFO_UPDATE_INTERVAL_SECONDS=${APP_TRACK_SCREEN_INFO_UPDATE_INTERVAL_SECONDS}

      - KEY_VAULT_SOURCE=${APP_KEY_VAULT_SOURCE}
      - KEY_VAULT_JSON=${APP_KEY_VAULT_JSON}

      # Admin
      - ADMIN_REJSEPLANEN_APIKEY=${APP_ADMIN_REJSEPLANEN_APIKEY:-}
      - ADMIN_SHOW_SCREEN_STATUS=${APP_ADMIN_SHOW_SCREEN_STATUS:-false}
      - ADMIN_TOUCH_BUTTON_REGIONS=${APP_ADMIN_TOUCH_BUTTON_REGIONS:-false}
      - ADMIN_LOGIN_METHODS=${APP_ADMIN_LOGIN_METHODS:?err}
      - ADMIN_ENHANCED_PREVIEW=${APP_ADMIN_ENHANCED_PREVIEW:-false}

      # Client
      - CLIENT_LOGIN_CHECK_TIMEOUT=${CLIENT_LOGIN_CHECK_TIMEOUT:-20000}
      - CLIENT_REFRESH_TOKEN_TIMEOUT=${CLIENT_REFRESH_TOKEN_TIMEOUT:-300000}
      - CLIENT_RELEASE_TIMESTAMP_INTERVAL_TIMEOUT=${CLIENT_RELEASE_TIMESTAMP_INTERVAL_TIMEOUT:-600000}
      - CLIENT_SCHEDULING_INTERVAL=${CLIENT_SCHEDULING_INTERVAL:-60000}
      - CLIENT_PULL_STRATEGY_INTERVAL=${CLIENT_PULL_STRATEGY_INTERVAL:-90000}
      - CLIENT_COLOR_SCHEME=${CLIENT_COLOR_SCHEME:-{"type":"library","lat":56.0,"lng":10.0}}
      - CLIENT_DEBUG=${CLIENT_DEBUG:-false}
    volumes:
      - ./jwt:/app/config/jwt:rw
      - ./media:/app/public/media:rw

  nginx:
    image: ghcr.io/itk-dev/os2display-api-service-nginx:${COMPOSE_IMAGE_VERSION}
    restart: unless-stopped
    networks:
      - app
      - frontend
    environment:
      - NGINX_FPM_SERVICE=${NGINX_FPM_SERVICE:-os2display}
      - NGINX_FPM_PORT=${NGINX_FPM_PORT:-9000}
      - NGINX_FPM_UPLOAD_MAX=${NGINX_FPM_UPLOAD_MAX:?}
      - NGINX_SET_REAL_IP_FROM=${NGINX_SET_REAL_IP_FROM:-172.16.0.0/16}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - os2display
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.os2display-http.rule=Host(`${COMPOSE_SERVER_DOMAIN}`)"
      - "traefik.http.routers.os2display-http.entrypoints=web"
      - "traefik.http.routers.os2display-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.os2display.rule=Host(`${COMPOSE_SERVER_DOMAIN}`)"
      - "traefik.http.routers.os2display.entrypoints=websecure"
      # Redirect root / request to /admin
      - "traefik.http.routers.os2display.middlewares=redirect-to-admin"
      - "traefik.http.middlewares.redirect-to-admin.redirectregex.regex=^https:\\/\\/([^\\/]+)\\/?$$"
      - "traefik.http.middlewares.redirect-to-admin.redirectregex.replacement=https://$$1/admin"
      # - "traefik.http.routers.os2display.middlewares=os2display"
      # - "traefik.http.middlewares.os2display.ipwhitelist.sourcerange=212.10.60.163, 10.225.0.0/16"
      # - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=ITKBasicAuth@file"
    volumes:
      - ./media:/app/public/media:rw

  redis:
    image: 'redis:6'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app
